<svg viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="badgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip0"><rect x="10" y="10" width="170" height="180" rx="14"/></clipPath>
    <clipPath id="clip1"><rect x="200" y="10" width="170" height="180" rx="14"/></clipPath>
    <clipPath id="clip2"><rect x="390" y="10" width="170" height="180" rx="14"/></clipPath>
    <clipPath id="clip3"><rect x="580" y="10" width="170" height="180" rx="14"/></clipPath>
  </defs>

  <!-- Badge 1 -->
  <rect x="10" y="10" width="170" height="180" rx="14" fill="#0D1117" stroke="url(#badgeBorder)" stroke-width="2" filter="url(#badgeGlow)"/>
  <text x="95" y="70" text-anchor="middle" font-size="34">🏆</text>
  <text x="95" y="115" text-anchor="middle" font-family="Fira Code, monospace" font-size="20" font-weight="700" fill="#00F7FF">1500+</text>
  <text x="95" y="140" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#8B949E">LeetCode Solved</text>
  <rect x="-90" y="10" width="60" height="180" fill="url(#shine)" clip-path="url(#clip0)" transform="skewX(-20)">
    <animate attributeName="x" values="-90;260" dur="3.5s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- Badge 2 -->
  <rect x="200" y="10" width="170" height="180" rx="14" fill="#0D1117" stroke="url(#badgeBorder)" stroke-width="2" filter="url(#badgeGlow)"/>
  <text x="285" y="70" text-anchor="middle" font-size="34">💼</text>
  <text x="285" y="115" text-anchor="middle" font-family="Fira Code, monospace" font-size="22" font-weight="700" fill="#7000FF">3+</text>
  <text x="285" y="140" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#8B949E">Internships / Roles</text>
  <rect x="100" y="10" width="60" height="180" fill="url(#shine)" clip-path="url(#clip1)" transform="skewX(-20)">
    <animate attributeName="x" values="100;450" dur="3.5s" begin="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- Badge 3 -->
  <rect x="390" y="10" width="170" height="180" rx="14" fill="#0D1117" stroke="url(#badgeBorder)" stroke-width="2" filter="url(#badgeGlow)"/>
  <text x="475" y="70" text-anchor="middle" font-size="34">🚀</text>
  <text x="475" y="115" text-anchor="middle" font-family="Fira Code, monospace" font-size="22" font-weight="700" fill="#FF007F">5+</text>
  <text x="475" y="140" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#8B949E">Projects Shipped</text>
  <rect x="290" y="10" width="60" height="180" fill="url(#shine)" clip-path="url(#clip2)" transform="skewX(-20)">
    <animate attributeName="x" values="290;640" dur="3.5s" begin="1.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Badge 4 -->
  <rect x="580" y="10" width="170" height="180" rx="14" fill="#0D1117" stroke="url(#badgeBorder)" stroke-width="2" filter="url(#badgeGlow)"/>
  <text x="665" y="70" text-anchor="middle" font-size="34">🧠</text>
  <text x="665" y="115" text-anchor="middle" font-family="Fira Code, monospace" font-size="22" font-weight="700" fill="#00FF88">3</text>
  <text x="665" y="140" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#8B949E">Certifications</text>
  <rect x="480" y="10" width="60" height="180" fill="url(#shine)" clip-path="url(#clip3)" transform="skewX(-20)">
    <animate attributeName="x" values="480;830" dur="3.5s" begin="2.7s" repeatCount="indefinite"/>
  </rect>
</svg>
