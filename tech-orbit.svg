<svg viewBox="-40 -40 860 860" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
      <animate attributeName="r" values="45%;52%;45%" dur="5s" repeatCount="indefinite"/>
    </radialGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rotating starfield -->
  <g opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 390 390" to="360 390 390" dur="90s" repeatCount="indefinite"/>
    <circle cx="120" cy="20" r="1.4" fill="#ffffff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="10" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="380" r="1.4" fill="#ffffff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="420" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="770" r="1.4" fill="#ffffff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="780" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="620" r="1.1" fill="#ffffff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="650" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="390" cy="390" r="360" fill="url(#bgGlow)"/>

  <!-- Outer decorative dashed ring, slowly rotating + colour-cycling -->
  <circle cx="390" cy="390" r="365" fill="none" stroke="#00F7FF" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 10">
    <animateTransform attributeName="transform" type="rotate" from="0 390 390" to="360 390 390" dur="60s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00F7FF;#7000FF;#FF007F;#00FF88;#00F7FF" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- New outermost ring guide -->
  <circle cx="390" cy="390" r="400" fill="none" stroke="#FF007F" stroke-opacity="0.13" stroke-width="1" stroke-dasharray="2 9"/>

  <!-- Orbit ring guides -->
  <circle cx="390" cy="390" r="140" fill="none" stroke="#00F7FF" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="390" cy="390" r="210" fill="none" stroke="#7000FF" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="390" cy="390" r="280" fill="none" stroke="#FF007F" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="390" cy="390" r="320" fill="none" stroke="#00FF88" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="3 7"/>
  <circle cx="390" cy="390" r="350" fill="none" stroke="#00FF88" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Radar ping pulses from core -->
  <circle cx="390" cy="390" r="64" fill="none" stroke="#00F7FF" stroke-width="2" opacity="0.7">
    <animate attributeName="r" values="64;220" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="390" cy="390" r="64" fill="none" stroke="#FF007F" stroke-width="2" opacity="0.7">
    <animate attributeName="r" values="64;220" begin="1.3s" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" begin="1.3s" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="390" cy="390" r="64" fill="none" stroke="#7000FF" stroke-width="2" opacity="0.7">
    <animate attributeName="r" values="64;220" begin="2.6s" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" begin="2.6s" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Spinning gradient ring around the core (loading-spinner style) -->
  <circle cx="390" cy="390" r="80" fill="none" stroke="url(#coreGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 430" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" from="0 390 390" to="360 390 390" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Comet travelling along the outer ring -->
  <circle r="5" fill="#00F7FF" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 390,25 A 365,365 0 1,1 389.9,25"/>
    <animate attributeName="fill" values="#00F7FF;#7000FF;#FF007F;#00F7FF" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Central core -->
  <circle cx="390" cy="390" r="64" fill="#0D1117" stroke="url(#coreGrad)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="r" values="62;68;62" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="390" y="382" text-anchor="middle" font-family="Fira Code, monospace" font-size="26" font-weight="700" fill="#00F7FF">AK</text>
  <text x="390" y="404" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#7000FF">FULL STACK</text>

  <!-- Orbit 1 (inner, clockwise, 12s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 390" to="360 390 390" dur="12s" repeatCount="indefinite"/>
    <g transform="translate(390,250)">
      <circle r="27" fill="#0D1117" stroke="#ED8B00" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="6" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#ED8B00" font-weight="700">Java</text>
    </g>
    <g transform="translate(390,530)">
      <circle r="27" fill="#0D1117" stroke="#61DAFB" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="6" text-anchor="middle" font-family="Fira Code, monospace" font-size="12" fill="#61DAFB" font-weight="700">React</text>
    </g>
  </g>

  <!-- Orbit 2 (18s, counter-clockwise) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 390 390" to="0 390 390" dur="18s" repeatCount="indefinite"/>
    <g transform="translate(390,180)">
      <circle r="26" fill="#0D1117" stroke="#339933" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="6" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#339933" font-weight="700">Node.js</text>
    </g>
    <g transform="translate(571.9,495)">
      <circle r="26" fill="#0D1117" stroke="#F7DF1E" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="6" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#F7DF1E" font-weight="700">JavaScript</text>
    </g>
    <g transform="translate(208.1,495)">
      <circle r="26" fill="#0D1117" stroke="#FFCA28" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="6" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#FFCA28" font-weight="700">Firebase</text>
    </g>
  </g>

  <!-- Orbit 3 (24s, clockwise) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 390" to="360 390 390" dur="24s" repeatCount="indefinite"/>
    <g transform="translate(390,110)">
      <circle r="25" fill="#0D1117" stroke="#3DDC84" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#3DDC84" font-weight="700">Android</text>
    </g>
    <g transform="translate(670,390)">
      <circle r="25" fill="#0D1117" stroke="#3776AB" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#3776AB" font-weight="700">Python</text>
    </g>
    <g transform="translate(390,670)">
      <circle r="25" fill="#0D1117" stroke="#F7931E" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#F7931E" font-weight="700">Sklearn</text>
    </g>
    <g transform="translate(110,390)">
      <circle r="25" fill="#0D1117" stroke="#4479A1" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#4479A1" font-weight="700">MySQL</text>
    </g>
  </g>

  <!-- Orbit 4 (32s, counter-clockwise) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 390 390" to="0 390 390" dur="32s" repeatCount="indefinite"/>
    <g transform="translate(390,40)">
      <circle r="23" fill="#0D1117" stroke="#F05032" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#F05032" font-weight="700">Git</text>
    </g>
    <g transform="translate(693.1,215)">
      <circle r="23" fill="#0D1117" stroke="#8B949E" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#e6edf3" font-weight="700">GitHub</text>
    </g>
    <g transform="translate(693.1,565)">
      <circle r="23" fill="#0D1117" stroke="#FF6C37" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#FF6C37" font-weight="700">Postman</text>
    </g>
    <g transform="translate(390,740)">
      <circle r="23" fill="#0D1117" stroke="#000000" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#e6edf3" font-weight="700">Express</text>
    </g>
    <g transform="translate(86.9,565)">
      <circle r="23" fill="#0D1117" stroke="#757575" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="7.5" fill="#e6edf3" font-weight="700">Material UI</text>
    </g>
    <g transform="translate(86.9,215)">
      <circle r="23" fill="#0D1117" stroke="#e34c26" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#e34c26" font-weight="700">XML</text>
    </g>
  </g>

  <!-- Orbit 5 (ML-focused, 27s, clockwise) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 390" to="360 390 390" dur="27s" repeatCount="indefinite"/>
    <g transform="translate(616.3,616.3)">
      <circle r="24" fill="#0D1117" stroke="#FF6F00" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#FF6F00" font-weight="700">TensorFlow</text>
    </g>
    <g transform="translate(163.7,616.3)">
      <circle r="24" fill="#0D1117" stroke="#7F52FF" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#7F52FF" font-weight="700">Kotlin</text>
    </g>
    <g transform="translate(163.7,163.7)">
      <circle r="24" fill="#0D1117" stroke="#150458" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#e6edf3" font-weight="700">Pandas</text>
    </g>
    <g transform="translate(616.3,163.7)">
      <circle r="24" fill="#0D1117" stroke="#013243" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#4479A1" font-weight="700">NumPy</text>
    </g>
  </g>

  <!-- Orbit 6 (cloud, outermost, 40s, counter-clockwise) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 390 390" to="0 390 390" dur="40s" repeatCount="indefinite"/>
    <g transform="translate(390,-10)">
      <circle r="22" fill="#0D1117" stroke="#FF9900" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#FF9900" font-weight="700">AWS</text>
    </g>
    <g transform="translate(736.4,220)">
      <circle r="22" fill="#0D1117" stroke="#0078D4" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#0078D4" font-weight="700">Azure</text>
    </g>
    <g transform="translate(43.6,220)">
      <circle r="22" fill="#0D1117" stroke="#4285F4" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#4285F4" font-weight="700">GCP</text>
    </g>
  </g>

  <!-- Twinkling particles -->
  <circle cx="60" cy="60" r="2.5" fill="#00F7FF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="70" r="2" fill="#FF007F">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="700" r="2" fill="#7000FF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="720" r="2.5" fill="#00F7FF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="390" cy="15" r="2" fill="#00FF88">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="390" cy="765" r="2" fill="#00FF88">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/>
  </circle>
</svg>
